<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوحة حوادث تجربة المستخدم — Elm</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function parseHash() {
  const h = window.location.hash || "#/";
  const [path, query] = h.slice(1).split("?");
  const parts = path.split("/").filter(Boolean);
  const params = {};
  if (query) {
    query.split("&").forEach((p) => {
      const [k, v] = p.split("=");
      params[k] = decodeURIComponent(v || "");
    });
  }
  return { path: parts, params };
}

function App() {
  const [route, setRoute] = useState(parseHash());
  const [role, setRole] = useState("admin");

  useEffect(() => {
    const onHash = () => { setRoute(parseHash()); window.scrollTo(0,0); };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const navigate = (h) => { window.location.hash = h; };
  const data = window.DASHBOARD_DATA;
  const ctx = { data, role };

  const { path, params } = route;
  let screen, currentNav = "overview", crumbs = [{ label: "نظرة عامة", h: "#/" }];

  if (!path.length || path[0] === "") {
    screen = <OverviewScreen ctx={ctx} navigate={navigate} />;
  } else if (path[0] === "incidents") {
    screen = <IncidentsScreen ctx={ctx} navigate={navigate} params={params} />;
    currentNav = "incidents";
    crumbs = [{ label: "نظرة عامة", h: "#/" }, { label: "الحوادث", current: true }];
  } else if (path[0] === "service") {
    screen = <ServiceScreen ctx={ctx} navigate={navigate} params={{ id: path[1] }} />;
    currentNav = "services";
    crumbs = [{ label: "نظرة عامة", h: "#/" }, { label: "الخدمات", current: true }];
  } else if (path[0] === "theme") {
    screen = <ThemeScreen ctx={ctx} navigate={navigate} params={{ id: path[1] }} />;
    currentNav = "themes";
    crumbs = [{ label: "نظرة عامة", h: "#/" }, { label: "المحاور", current: true }];
  } else if (path[0] === "trends") {
    screen = <TrendsScreen ctx={ctx} navigate={navigate} />;
    currentNav = "trends";
    crumbs = [{ label: "نظرة عامة", h: "#/" }, { label: "الاتجاهات", current: true }];
  } else if (path[0] === "sla") {
    screen = <SlaScreen ctx={ctx} navigate={navigate} />;
    currentNav = "sla";
    crumbs = [{ label: "نظرة عامة", h: "#/" }, { label: "اتفاقية الخدمة", current: true }];
  } else {
    screen = <div className="page"><div className="empty">الصفحة غير موجودة</div></div>;
  }

  const NAV = [
    { key: "overview", label: "نظرة عامة", icon: "home", h: "#/" },
    { key: "incidents", label: "الحوادث", icon: "list", h: "#/incidents" },
    { key: "trends", label: "الاتجاهات", icon: "trend", h: "#/trends" },
  ];

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand">
          <ElmMark size={30} />
          <div>
            <div className="name">علم</div>
            <div className="sub">حوادث تجربة المستخدم</div>
          </div>
        </div>
        <div>
          <div className="group-label">العمل</div>
          <nav>
            {NAV.map((n) => (
              <button key={n.key} className={`nav-item ${currentNav === n.key ? "active" : ""}`} onClick={() => navigate(n.h)}>
                <Icon name={n.icon} size={17} />
                {n.label}
              </button>
            ))}
          </nav>
        </div>
        <div className="footer-card">
          <div className="live"><span className="dot"/>متصل بمصدر البيانات</div>
          {data.meta.source}<br/>
          آخر مزامنة: {data.meta.lastSync}
        </div>
      </aside>

      <main>
        <div className="topbar">
          <div className="breadcrumb">
            {crumbs.map((c, i) => (
              <React.Fragment key={i}>
                {i > 0 && <span className="sep">/</span>}
                {c.current ? <span className="current">{c.label}</span> : <span className="crumb" onClick={() => c.h && navigate(c.h)}>{c.label}</span>}
              </React.Fragment>
            ))}
          </div>
          <div className="spacer"/>
          <div className="search">
            <Icon name="search" size={16}/>
            <input placeholder="بحث في الحوادث، الخدمات، المحاور…" />
            <kbd>⌘K</kbd>
          </div>
          <div className="spacer"/>
        </div>
        {screen}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
